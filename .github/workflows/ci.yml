name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "4.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run tests
        run: just spec

      - name: Run CI check (spec, lint, coverage)
        if: matrix.ruby-version == '4.0'
        run: just ci

      - name: Upload coverage
        if: matrix.ruby-version == '4.0'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
